<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetTools - Utilidades de Red y Sistemas</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
        }
        h1 {
            text-align: center;
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        h2 {
            font-size: 1.2rem;
            color: #e2e8f0;
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        .results {
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
        }
        .result-item {
            margin: 5px 0;
        }
        .result-label {
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>NetTools Web</h1>
    <div class="subtitle">Herramienta de Diagnóstico y Conversión</div>

    <!-- Módulo 1: Conversor Numérico -->
    <div class="section">
        <h2>1. Conversor de Sistemas Numéricos</h2>
        <label for="decimalInput">Ingresa un número decimal:</label>
        <input type="number" id="decimalInput" placeholder="Ej. 192" oninput="convertirNumeros()">
        
        <div class="results" id="conversionResults">
            <div class="result-item"><span class="result-label">Binario:</span> -</div>
            <div class="result-item"><span class="result-label">Octal:</span> -</div>
            <div class="result-item"><span class="result-label">Hexadecimal:</span> -</div>
        </div>
    </div>

    <!-- Módulo 2: Identificador de IP / Red -->
    <div class="section">
        <h2>2. Identificador de Clase IP</h2>
        <label for="ipInput">Ingresa el primer octeto de una IP (1-255):</label>
        <input type="number" id="ipInput" min="1" max="255" placeholder="Ej. 192" oninput="analizarIP()">
        
        <div class="results" id="ipResults">
            <div class="result-item"><span class="result-label">Clase de Red:</span> -</div>
            <div class="result-item"><span class="result-label">Tipo de Red:</span> -</div>
        </div>
    </div>
</div>

<script>
    function convertirNumeros() {
        const val = parseInt(document.getElementById('decimalInput').value);
        const resultsDiv = document.getElementById('conversionResults');
        
        if (isNaN(val)) {
            resultsDiv.innerHTML = `
                <div class="result-item"><span class="result-label">Binario:</span> -</div>
                <div class="result-item"><span class="result-label">Octal:</span> -</div>
                <div class="result-Item"><span class="result-label">Hexadecimal:</span> -</div>
            `;
            return;
        }

        resultsDiv.innerHTML = `
            <div class="result-item"><span class="result-label">Binario:</span> ${val.toString(2)}</div>
            <div class="result-item"><span class="result-label">Octal:</span> ${val.toString(8)}</div>
            <div class="result-item"><span class="result-label">Hexadecimal:</span> ${val.toString(16).toUpperCase()}</div>
        `;
    }

    function analizarIP() {
        const octet = parseInt(document.getElementById('ipInput').value);
        const ipResultsDiv = document.getElementById('ipResults');

        if (isNaN(octet)) {
            ipResultsDiv.innerHTML = `
                <div class="result-item"><span class="result-label">Clase de Red:</span> -</div>
                <div class="result-item"><span class="result-label">Tipo de Red:</span> -</div>
            `;
            return;
        }

        let clase = "";
        let tipo = "Pública / Estándar";

        if (octet >= 1 && octet <= 126) {
            clase = "Clase A (Mascara por defecto: 255.0.0.0)";
            if (octet === 10) tipo = "Privada (RFC 1918)";
        } else if (octet >= 128 && octet <= 191) {
            clase = "Clase B (Mascara por defecto: 255.255.0.0)";
            if (octet === 172) tipo = "Privada (Segmento 172.16.x.x)";
        } else if (octet >= 192 && octet <= 223) {
            clase = "Clase C (Mascara por defecto: 255.255.255.0)";
            if (octet === 192) tipo = "Privada (Segmento 192.168.x.x)";
        } else if (octet >= 224 && octet <= 239) {
            clase = "Clase D (Multicast)";
            tipo = "Especial";
        } else if (octet >= 240 && octet <= 255) {
            clase = "Clase E (Experimental)";
            tipo = "Investigación";
        } else {
            clase = "Dirección Reservada (Loopback u otro)";
            tipo = "Especial";
        }

        ipResultsDiv.innerHTML = `
            <div class="result-item"><span class="result-label">Clase de Red:</span> ${clase}</div>
            <div class="result-item"><span class="result-label">Tipo de Red:</span> ${tipo}</div>
        `;
    }
</script>

</body>
</html>
